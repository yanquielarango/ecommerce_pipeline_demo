# The main pipeline for ecommerce_pipeline_demo

resources:
  pipelines:
    ecommerce_pipeline_demo_etl:
      name: ecommerce_pipeline_demo
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ecommerce_pipeline_demo_etl"

      libraries:
        - glob:
            include: ../src/ecommerce_pipeline_demo_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
