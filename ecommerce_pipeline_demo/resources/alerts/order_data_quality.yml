resources:
  alerts:
    order_data_quality:
      display_name: "Order Data Quality Alert"

      query_text: |
        SELECT
          COUNT(*) AS invalid_records
        FROM ${var.catalog}.${var.silver_schema}.quarantine_orders
        WHERE ingest_datetime >= current_timestamp() - INTERVAL 15 MINUTES

      warehouse_id: ${var.sql_warehouse_id}

      evaluation:
        comparison_operator: GREATER_THAN

        source:
          name: invalid_records
          display: invalid_records

        threshold:
          value:
            double_value: 0

        notification:
          notify_on_ok: true
          retrigger_seconds: 0

      schedule:
        quartz_cron_schedule: "0 0/5 * * * ?"
        timezone_id: "Europe/Warsaw"
        pause_status: "UNPAUSED"