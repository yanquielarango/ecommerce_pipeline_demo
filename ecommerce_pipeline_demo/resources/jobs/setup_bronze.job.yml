resources:
  jobs:
    setup_bronze:
      name: setup_bronze

      tasks:
        - task_key: create_orders_bronze
          sql_task:
            file:
              path: ${workspace.file_path}/src/setup/create_orders_bronze.sql
              source: WORKSPACE
            warehouse_id: ${var.sql_warehouse_id}

            parameters:
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze.name}