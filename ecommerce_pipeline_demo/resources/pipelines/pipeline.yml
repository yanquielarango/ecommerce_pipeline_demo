resources:
  pipelines:
    ecommerce_pipeline:
      name: ecommerce_sdp_demo

      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}

      serverless: true
      root_path: ../../src

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${resources.schemas.bronze.name}
        silver_schema: ${resources.schemas.silver.name}
        gold_schema: ${resources.schemas.gold.name}
        start_date: "2016-01-01"
        end_date: "2018-12-31"

      libraries:
        - glob:
            include: ../../src/transformations/**