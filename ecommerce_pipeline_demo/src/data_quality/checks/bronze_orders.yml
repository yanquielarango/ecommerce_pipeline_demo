- criticality: warn
  name: quantity_positive
  check:
    function: sql_expression
    arguments:
      expression: quantity > 0
      msg: quantity must be greater than 0

- criticality: warn
  name: price_non_negative
  check:
    function: sql_expression
    arguments:
      expression: price >= 0
      msg: price must be greater than or equal to 0