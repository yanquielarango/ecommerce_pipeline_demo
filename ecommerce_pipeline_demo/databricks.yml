bundle:
  name: ecommerce_pipeline_demo
  uuid: 5d7eb2ae-60fd-4098-82a6-b0d4f634b317

include:
  - resources/**/*.yml

variables:
  catalog:
    description: The catalog to use

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema

  gold_schema:
    description: Gold schema

targets:

  dev:
    default: true

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net

    presets:
      name_prefix: ""
      pipelines_development: true
      trigger_pause_status: PAUSED

    variables:
      catalog: dbr_dev
      bronze_schema: ecommerce_bronze
      silver_schema: ecommerce_silver
      gold_schema: ecommerce_gold

  prod:
    mode: production

    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      root_path: /Workspace/Users/yanquiel@softserve.academy/.bundle/${bundle.name}/${bundle.target}

    variables:
      catalog: dbr_dev
      bronze_schema: ecommerce_bronze
      silver_schema: ecommerce_silver
      gold_schema: ecommerce_gold

    permissions:
      - user_name: yanquiel@softserve.academy
        level: CAN_MANAGE