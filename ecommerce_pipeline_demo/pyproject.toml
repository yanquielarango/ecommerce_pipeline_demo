[project]
name = "ecommerce_pipeline_demo"
version = "0.0.1"
authors = [{ name = "yanquiel@softserve.academy" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "databricks-zerobus-ingest-sdk>=1.6.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

test = [
    "pytest",
    "pyspark==3.5.0",
]

[tool.uv]
package = false

conflicts = [
    [
        { group = "dev" },
        { group = "test" },
    ],
]

[project.scripts]
main = "ecommerce_pipeline_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]