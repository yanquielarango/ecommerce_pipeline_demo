trigger:
  branches:
    include:
      - main

parameters:
  - name: deployProd
    displayName: Deploy to production
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

stages:

# =========================================================
# DEV
# =========================================================

- stage: Dev
  displayName: Validate and Deploy DEV

  variables:
    - group: demo2-databricks-dev

  jobs:
    - job: DevDeployment
      displayName: DEV Deployment

      steps:
        - checkout: self

        - bash: |
            curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            databricks version
          displayName: Install Databricks CLI

        - bash: |
            set -e

            databricks bundle validate -t dev
            databricks bundle summary -t dev
            databricks bundle deploy -t dev
          displayName: Validate and Deploy DEV bundle

          workingDirectory: $(Build.SourcesDirectory)/ecommerce_pipeline_demo

          env:
            DATABRICKS_AUTH_TYPE: oauth-m2m
            DATABRICKS_HOST: $(DATABRICKS_HOST)
            DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
            DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

            BUNDLE_VAR_zerobus_principal_id: $(DATABRICKS_CLIENT_ID)


# =========================================================
# PROD
# =========================================================

- stage: Prod
  displayName: Validate and Deploy PROD

  dependsOn: Dev

  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ${{ eq(parameters.deployProd, true) }}
    )

  variables:
    - group: demo2-databricks-prod

  jobs:
    - job: ProdDeployment
      displayName: PROD Deployment

      steps:
        - checkout: self

        - bash: |
            curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            databricks version
          displayName: Install Databricks CLI

        - bash: |
            set -e

            databricks bundle validate -t prod
            databricks bundle summary -t prod
            databricks bundle deploy -t prod
          displayName: Validate and Deploy PROD bundle

          workingDirectory: $(Build.SourcesDirectory)/ecommerce_pipeline_demo

          env:
            DATABRICKS_AUTH_TYPE: oauth-m2m
            DATABRICKS_HOST: $(DATABRICKS_HOST)
            DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
            DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)

            BUNDLE_VAR_zerobus_principal_id: $(DATABRICKS_CLIENT_ID)