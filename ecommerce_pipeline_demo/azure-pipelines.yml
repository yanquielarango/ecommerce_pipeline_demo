trigger:
  branches:
    include:
      - main

parameters:
  - name: deployProd
    displayName: Deploy to production
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

stages:

  # =========================================================
  # 1. VALIDATE DEV
  # =========================================================
  - stage: Validate
    displayName: Validate Databricks Bundle

    variables:
      - group: demo2-databricks-dev

    jobs:
      - job: ValidateBundle
        displayName: Validate DEV bundle

        steps:
          - checkout: self

          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
              databricks version
            displayName: Install Databricks CLI

          - bash: |
              databricks bundle validate -t dev
            displayName: Validate DEV bundle
            workingDirectory: $(Build.SourcesDirectory)/ecommerce_pipeline_demo
            env:
              DATABRICKS_AUTH_TYPE: oauth-m2m
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
              BUNDLE_VAR_zerobus_principal_id: $(DATABRICKS_CLIENT_ID)

  # =========================================================
  # 2. DEPLOY DEV
  # =========================================================
  - stage: DeployDev
    displayName: Deploy to DEV
    dependsOn: Validate

    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )

    variables:
      - group: demo2-databricks-dev

    jobs:
      - job: DeployDevBundle
        displayName: Deploy DEV bundle

        steps:
          - checkout: self

          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
              databricks version
            displayName: Install Databricks CLI

          # TEMPORARY:
          # Bind schemas that already exist in DEV to the
          # deployment state owned by the CI/CD Service Principal.
          # Remove this step after the first successful deployment.
          - bash: |
              databricks bundle deployment bind -t dev bronze dbr_dev.ecommerce_bronze --auto-approve
              databricks bundle deployment bind -t dev silver dbr_dev.ecommerce_silver --auto-approve
              databricks bundle deployment bind -t dev gold dbr_dev.ecommerce_gold --auto-approve
            displayName: Bind existing DEV schemas
            workingDirectory: $(Build.SourcesDirectory)/ecommerce_pipeline_demo
            env:
              DATABRICKS_AUTH_TYPE: oauth-m2m
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
              BUNDLE_VAR_zerobus_principal_id: $(DATABRICKS_CLIENT_ID)

          - bash: |
              databricks bundle deploy -t dev
            displayName: Deploy bundle to DEV
            workingDirectory: $(Build.SourcesDirectory)/ecommerce_pipeline_demo
            env:
              DATABRICKS_AUTH_TYPE: oauth-m2m
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
              BUNDLE_VAR_zerobus_principal_id: $(DATABRICKS_CLIENT_ID)

  # =========================================================
  # 3. DEPLOY PROD
  # =========================================================
  - stage: DeployProd
    displayName: Deploy to PROD
    dependsOn: DeployDev

    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ${{ eq(parameters.deployProd, true) }}
      )

    variables:
      - group: demo2-databricks-prod

    jobs:
      - job: DeployProdBundle
        displayName: Deploy PROD bundle

        steps:
          - checkout: self

          - bash: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
              databricks version
            displayName: Install Databricks CLI

          - bash: |
              databricks bundle validate -t prod
              databricks bundle deploy -t prod
            displayName: Validate and deploy PROD
            workingDirectory: $(Build.SourcesDirectory)/ecommerce_pipeline_demo
            env:
              DATABRICKS_AUTH_TYPE: oauth-m2m
              DATABRICKS_HOST: $(DATABRICKS_HOST)
              DATABRICKS_CLIENT_ID: $(DATABRICKS_CLIENT_ID)
              DATABRICKS_CLIENT_SECRET: $(DATABRICKS_CLIENT_SECRET)
              BUNDLE_VAR_zerobus_principal_id: $(DATABRICKS_CLIENT_ID)